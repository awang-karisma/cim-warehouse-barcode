version: '3.8'

services:
  barcode-server:
    build: .
    container_name: barcode-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/barcode.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-}
      - ACCURATE_ENCRYPTION_KEY=${ACCURATE_ENCRYPTION_KEY:-}
    volumes:
      - barcode-data:/data

volumes:
  barcode-data:
